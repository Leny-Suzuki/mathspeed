<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マスピード Ver.9.0 通信ロビーテスト</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#22335c,#080f26 80%);color:#f6e9c6;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(540px,100%);border:2px solid #d9b663;border-radius:18px;background:#142344;padding:24px;box-shadow:0 20px 70px #0008}h1{font-size:1.55rem;margin:0 0 8px}p{line-height:1.65}.muted{color:#b8c7df;font-size:.92rem}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{background:#32558e;border:1px solid #e1bf6b;color:white;border-radius:10px;padding:12px 16px;font-size:1rem;cursor:pointer;min-height:48px}.btn:disabled{opacity:.45;cursor:default}.btn.gold{background:#84612b}.code{font-size:2.6rem;letter-spacing:.2em;text-align:center;color:#ffe08b;font-weight:800;margin:14px 0}.input{width:100%;font-size:1.7rem;letter-spacing:.25em;text-align:center;background:#0c1730;color:white;border:1px solid #c8a65b;border-radius:10px;padding:12px;margin:10px 0}.hidden{display:none}.status{background:#0b1831;border-radius:10px;padding:12px;margin-top:16px;min-height:56px;white-space:pre-wrap}.section{margin:18px 0}.small{font-size:.8rem;color:#aebdd4}a{color:#b6d8ff}</style></head><body><main class="panel"><h1>⚔️ MATHSPEED <small>Ver.9.0</small></h1><p class="muted">通信対戦・接続テスト（まだカード対戦はできません）</p><div id="loading" class="status">Firebaseに接続中…</div><div id="menu" class="hidden"><div class="section"><button id="create" class="btn gold">🏠 部屋を作る</button></div><div class="section"><label for="codeInput">友達の6桁のルーム番号</label><input class="input" id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456"><button id="join" class="btn">🚪 部屋に入る</button></div></div><div id="roomPanel" class="hidden"><p class="muted">ルーム番号</p><div id="roomCode" class="code">------</div><div class="row"><button id="copy" class="btn">番号をコピー</button><button id="leave" class="btn">退出する</button></div><div id="roomStatus" class="status">接続待ち…</div></div><div id="message" class="status hidden" role="status"></div><p class="small">同じURLを2台で開いて試してください。インターネット接続が必要です。テスト終了後、作成者は「退出する」を押してください。30分で部屋は無効になります。</p></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
'use strict';
const config={apiKey:'AIzaSyC9J3X3oefV3NiAnFIHJUlhEsFK4qaPEqA',authDomain:'mathspeed-ae3c1.firebaseapp.com',databaseURL:'https://mathspeed-ae3c1-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'mathspeed-ae3c1',appId:'1:966068532607:web:6f77134af224b84e10164a'};
const $=id=>document.getElementById(id);let uid=null,roomRef=null,roomCode='',isHost=false;
const show=(id,yes)=>$(id).classList.toggle('hidden',!yes);
function message(t){$('message').textContent=t;show('message',!!t)}
function error(e){message('エラー：'+(e?.message||String(e)))}
function menu(){show('menu',true);show('roomPanel',false);$('create').disabled=false;$('join').disabled=false}
function openRoom(code,host){roomCode=code;isHost=host;show('menu',false);show('roomPanel',true);$('roomCode').textContent=code;message('');roomRef=firebase.database().ref('rooms/'+code);roomRef.on('value',s=>{const r=s.val();if(!r){$('roomStatus').textContent='部屋が閉じられました。';return}if(r.expiresAt<=Date.now()){$('roomStatus').textContent='この部屋の有効期限が切れました。';return}$('roomStatus').textContent=r.guestUid?'✅ 2人が揃ったよ！ 接続成功！\n次のバージョンで対戦を実装します。':'⏳ 友達の参加を待っています…';},e=>error(e))}
async function createRoom(){if(!uid)return;$('create').disabled=true;message('部屋を作成中…');try{for(let i=0;i<8;i++){let code=String(Math.floor(Math.random()*1000000)).padStart(6,'0');let ref=firebase.database().ref('rooms/'+code);let now=Date.now();let result=await ref.transaction(current=>current===null?{hostUid:uid,guestUid:'',status:'waiting',createdAt:now,expiresAt:now+1800000}:undefined,undefined,false);if(result.committed){openRoom(code,true);return}}throw Error('空き番号を確保できませんでした。再試行してください。')}catch(e){error(e)}finally{$('create').disabled=false}}
async function joinRoom(){if(!uid)return;let code=$('codeInput').value.trim();if(!/^\d{6}$/.test(code)){message('6桁の数字を入力してね。');return}$('join').disabled=true;message('参加中…');try{let ref=firebase.database().ref('rooms/'+code);let result=await ref.transaction(r=>{if(!r||r.expiresAt<=Date.now()||r.guestUid||r.hostUid===uid)return;return {...r,guestUid:uid,status:'ready'}},undefined,false);if(!result.committed){message('部屋がない・満員・期限切れの可能性があります。');return}openRoom(code,false)}catch(e){error(e)}finally{$('join').disabled=false}}
async function leave(){if(roomRef){let old=roomRef;roomRef.off();if(isHost){try{await old.remove()}catch(e){error(e)}}}roomRef=null;roomCode='';menu()}
$('create').addEventListener('click',createRoom);$('join').addEventListener('click',joinRoom);$('leave').addEventListener('click',leave);$('copy').addEventListener('click',()=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(roomCode).then(()=>message('ルーム番号をコピーしたよ！')).catch(()=>message('番号を選択してコピーしてね。'));else message('番号を選択してコピーしてね。')});
try{firebase.initializeApp(config);firebase.auth().onAuthStateChanged(u=>{if(u){uid=u.uid;show('loading',false);menu()}else firebase.auth().signInAnonymously().catch(error)})}catch(e){error(e)}
</script></body></html>
