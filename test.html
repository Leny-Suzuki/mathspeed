<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マスピード Ver.9.1 通信診断</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#22335c,#080f26 80%);color:#f6e9c6;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(600px,100%);border:2px solid #d9b663;border-radius:18px;background:#142344;padding:24px;box-shadow:0 20px 70px #0008}h1{font-size:1.55rem;margin:0 0 8px}p{line-height:1.65}.muted{color:#b8c7df;font-size:.92rem}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{background:#32558e;border:1px solid #e1bf6b;color:white;border-radius:10px;padding:12px 16px;font-size:1rem;cursor:pointer;min-height:48px}.btn:disabled{opacity:.45;cursor:default}.btn.gold{background:#84612b}.code{font-size:2.6rem;letter-spacing:.2em;text-align:center;color:#ffe08b;font-weight:800;margin:14px 0}.input{width:100%;font-size:1.7rem;letter-spacing:.25em;text-align:center;background:#0c1730;color:white;border:1px solid #c8a65b;border-radius:10px;padding:12px;margin:10px 0}.hidden{display:none}.status{background:#0b1831;border-radius:10px;padding:12px;margin-top:16px;min-height:56px;white-space:pre-wrap;overflow-wrap:anywhere}.section{margin:18px 0}.small{font-size:.8rem;color:#aebdd4}.log{font-size:.82rem;max-height:300px;overflow:auto;line-height:1.55}.label{font-weight:700;margin-top:20px}.good{color:#a7efbb}a{color:#b6d8ff}</style></head><body><main class="panel"><h1>⚔️ MATHSPEED <small>Ver.9.1</small></h1><p class="muted">通信対戦・原因調査テスト（カード対戦はまだできません）</p><div id="loading" class="status">Firebaseに接続中…</div><div id="menu" class="hidden"><div class="section"><button id="create" class="btn gold">🏠 部屋を作る</button></div><div class="section"><label for="codeInput">友達の6桁のルーム番号</label><input class="input" id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456"><button id="join" class="btn">🚪 部屋に入る・診断</button></div></div><div id="roomPanel" class="hidden"><p class="muted">ルーム番号</p><div id="roomCode" class="code">------</div><div class="row"><button id="copy" class="btn">番号をコピー</button><button id="leave" class="btn">退出する</button></div><div id="roomStatus" class="status">接続待ち…</div></div><div id="message" class="status hidden" role="status"></div><div class="label">🔎 通信診断ログ</div><div id="diagnostics" class="status log" role="log" aria-live="polite">まだ操作していません。</div><div class="row" style="margin-top:10px"><button id="copyLog" class="btn">診断ログをコピー</button><button id="clearLog" class="btn">ログを消す</button></div><p class="small">Macとスマホで同じURLを開いてください。インターネット接続が必要です。個人識別用のUIDはログに表示しません。30分で部屋は期限切れになります。診断中は部屋を作った側の画面を閉じないでください。</p></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
'use strict';
const config={apiKey:'AIzaSyC9J3X3oefV3NiAnFIHJU1hEsFK4qaPEqA',authDomain:'mathspeed-ae3c1.firebaseapp.com',databaseURL:'https://mathspeed-ae3c1-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'mathspeed-ae3c1',appId:'1:966068532607:web:6f77134af224b84e10164a'};
const $=id=>document.getElementById(id);let uid=null,roomRef=null,roomCode='',isHost=false,serverOffset=0,logLines=[];
const show=(id,yes)=>$(id).classList.toggle('hidden',!yes);
function log(t){const stamp=new Date().toLocaleTimeString('ja-JP');logLines.push('['+stamp+'] '+t);$('diagnostics').textContent=logLines.join('\n');$('diagnostics').scrollTop=$('diagnostics').scrollHeight}
function message(t){$('message').textContent=t;show('message',!!t)}
function error(e,step='通信'){const code=e&&e.code?e.code:'不明';const detail=e&&e.message?e.message:String(e);log('❌ '+step+'エラー: '+code+' / '+detail);message('エラー：'+detail)}
function menu(){show('menu',true);show('roomPanel',false);$('create').disabled=false;$('join').disabled=false}
function nowServer(){return Date.now()+serverOffset}
function closeListener(){if(roomRef){roomRef.off();roomRef=null}}
function openRoom(code,host){closeListener();roomCode=code;isHost=host;show('menu',false);show('roomPanel',true);$('roomCode').textContent=code;message('');roomRef=firebase.database().ref('rooms/'+code);roomRef.on('value',s=>{const r=s.val();if(!r){$('roomStatus').textContent='部屋が閉じられました。';log('部屋 '+code+' が削除されました');return}if(r.expiresAt<=nowServer()){$('roomStatus').textContent='この部屋の有効期限が切れました。';return}$('roomStatus').textContent=r.guestUid?'✅ 2人が揃ったよ！ 接続成功！':'⏳ 友達の参加を待っています…';if(r.guestUid)log('✅ 部屋 '+code+'：ゲスト参加を確認')},e=>error(e,'部屋監視'));log((host?'ホスト':'ゲスト')+'として部屋 '+code+' を監視開始')}
async function createRoom(){if(!uid)return;$('create').disabled=true;message('部屋を作成中…');try{for(let i=0;i<8;i++){const code=String(Math.floor(Math.random()*1000000)).padStart(6,'0');const ref=firebase.database().ref('rooms/'+code);const now=nowServer();const result=await ref.transaction(current=>current===null?{hostUid:uid,guestUid:'',status:'waiting',createdAt:now,expiresAt:now+1800000}:undefined,undefined,false);if(result.committed){log('✅ 部屋作成成功：'+code);openRoom(code,true);return}}throw Error('空き番号を確保できませんでした。再試行してください。')}catch(e){error(e,'部屋作成')}finally{$('create').disabled=false}}
async function joinRoom(){if(!uid)return;const code=$('codeInput').value.trim();if(!/^\d{6}$/.test(code)){message('6桁の数字を入力してね。');return}$('join').disabled=true;message('参加条件を診断しています…');log('―― 参加診断開始：'+code+' ――');try{const ref=firebase.database().ref('rooms/'+code);log('① 部屋データを読み取り中…');let snap;try{snap=await ref.once('value')}catch(e){error(e,'① 読み取り');return}const r=snap.val();if(!r){log('❌ ① 部屋が存在しません（読み取り結果 null）');message('部屋が見つかりません。新しい番号を作って試してね。');return}log('✅ ① 部屋を読み取れました');log('② 状態：'+String(r.status)+' / ゲスト：'+(r.guestUid?'登録済み':'未登録'));
if(r.hostUid===uid){log('❌ 同じ匿名アカウントでホストとゲストを兼ねようとしています');message('同じアカウントでは参加できません。別端末のブラウザで試してね。');return}
if(r.guestUid){log('❌ すでにゲストが登録されています');message('この部屋は満員です。');return}
const remaining=Math.round((Number(r.expiresAt)-nowServer())/1000);log('③ 有効期限まで '+remaining+' 秒（サーバー時刻補正 '+Math.round(serverOffset/1000)+' 秒）');if(remaining<=0){log('❌ 部屋の期限が切れています');message('部屋の有効期限が切れています。新しい部屋を作ってね。');return}
if(r.status!=='waiting'){log('❌ 部屋の状態が waiting ではありません');message('この部屋は参加受付中ではありません。');return}
log('④ 参加条件OK。transaction() を開始…');let calls=0;let sawNull=false;const result=await ref.transaction(current=>{calls++;if(current===null){sawNull=true;return undefined}if(current.expiresAt<=nowServer()||current.guestUid||current.hostUid===uid||current.status!=='waiting')return undefined;return {...current,guestUid:uid,status:'ready'}},undefined,false);log('⑤ transaction結果：committed='+result.committed+' / callback='+calls+'回'+(sawNull?' / nullデータを検出':''));if(!result.committed){const after=result.snapshot&&result.snapshot.val();if(after){log('⑥ 中断時の状態：'+String(after.status)+' / ゲスト：'+(after.guestUid?'登録済み':'未登録'));}else{log('⑥ transactionの中断時にデータがありません')}message('参加処理が中断されました。下の診断ログをコピーして送ってね。');return}log('🎉 参加成功！');openRoom(code,false)}catch(e){error(e,'参加処理')}finally{$('join').disabled=false}}
async function leave(){if(roomRef){const old=roomRef;closeListener();if(isHost){try{await old.remove();log('ホストが部屋を削除しました')}catch(e){error(e,'退出時の部屋削除')}}else{log('ゲストが画面から退出しました（部屋の参加登録は維持）')}}roomCode='';isHost=false;menu()}
$('create').addEventListener('click',createRoom);$('join').addEventListener('click',joinRoom);$('leave').addEventListener('click',leave);$('copy').addEventListener('click',()=>{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(roomCode).then(()=>message('ルーム番号をコピーしたよ！')).catch(()=>message('番号を選択してコピーしてね。'));else message('番号を選択してコピーしてね。')});$('copyLog').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(logLines.join('\n'));message('診断ログをコピーしたよ！')}catch(e){message('コピーできない場合は診断ログのスクリーンショットを送ってね。')}});$('clearLog').addEventListener('click',()=>{logLines=[];$('diagnostics').textContent='ログを消しました。'});
try{firebase.initializeApp(config);firebase.database().ref('.info/serverTimeOffset').on('value',s=>{serverOffset=Number(s.val())||0;log('サーバー時刻の補正値：約'+Math.round(serverOffset/1000)+'秒')},e=>error(e,'時刻同期'));firebase.auth().onAuthStateChanged(u=>{if(u){uid=u.uid;show('loading',false);menu();log('✅ 匿名認証：'+(u.isAnonymous?'有効':'通常アカウント'))}else{log('匿名認証を開始します');firebase.auth().signInAnonymously().catch(e=>error(e,'匿名認証'))}})}catch(e){error(e,'初期化')}
</script></body></html>
